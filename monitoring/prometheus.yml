# Prometheus scrapes the API and the stream consumer every 5 s (service names from docker-compose.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: consumer
    static_configs:
      - targets: ["consumer:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
