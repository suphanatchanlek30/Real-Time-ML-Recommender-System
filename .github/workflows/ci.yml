name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-serve.txt
            requirements-test.txt

      # everything the tests import, but not implicit/mlflow (training code imports them lazily)
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-serve.txt -r requirements-test.txt scipy matplotlib

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # tests that need the real dataset or the running stack skip themselves
      - name: Test
        run: pytest -q

      - name: docker-compose.yml is valid with the .env template
        run: |
          cp .env.example .env
          docker compose config -q

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the consumer / producer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.consumer
          push: false
          cache-from: type=gha,scope=consumer
          cache-to: type=gha,scope=consumer,mode=max
