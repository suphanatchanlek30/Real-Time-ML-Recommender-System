# Online half of the system: Kafka -> consumer -> Redis -> API.
#   make env       create .env from .env.example (once), then edit .env
#   make up        start kafka, redis, api, consumer, prometheus, grafana
#   make replay    reset Redis and the topic, then replay events (producer has profile `demo`)
#
# Every value you may want to change (ports, images, topic, timeouts, snapshot, token) comes from
# .env through ${NAME}; nothing is baked into the images. What stays here is the wiring between
# containers that cannot change: service host names (redis, kafka) and where the model and the
# feature tables are mounted (read-only, not copied into the images).

services:
  kafka:
    image: ${KAFKA_IMAGE}       # KRaft mode: no Zookeeper
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9094"   # host access (producer/smoke test run from the Mac)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # state is rebuilt from the batch load
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "${API_PORT}:8000"
    environment:
      REDIS_URL: redis://redis:6379/${REDIS_DB}
      REDIS_TIMEOUT_S: ${REDIS_TIMEOUT_S}
      MODEL_DIR: /models/champion
      FEATURES_DIR: /data/features
      FEATURES_SNAPSHOT: ${FEATURES_SNAPSHOT}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ./models:/models:ro
      - ./data/features:/data/features:ro
    depends_on:
      redis:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    environment:
      REDIS_URL: redis://redis:6379/${REDIS_DB}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_GROUP: ${KAFKA_GROUP}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS}
      FEATURES_DIR: /data/features
      FEATURES_SNAPSHOT: ${FEATURES_SNAPSHOT}
    volumes:
      - ./data/features:/data/features:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    profiles: ["demo"]
    command: ["python", "-m", "src.streaming.producer", "--rate", "${KAFKA_REPLAY_RATE}"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS}
      FEATURES_DIR: /data/features
      FEATURES_SNAPSHOT: ${FEATURES_SNAPSHOT}
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver   # k6 sends its client-side metrics here
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - consumer

  grafana:
    image: ${GRAFANA_IMAGE}
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local use: dashboards can be viewed without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/recsys.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: ${K6_IMAGE}
    profiles: ["loadtest"]
    # run with:  make loadtest   (docker compose run --rm k6 run /loadtest/k6.js)
    environment:
      BASE_URL: http://api:8000
      SCENARIO: ${K6_SCENARIO}
      # send k6's own metrics to Prometheus so Grafana shows them next to the server-side ones
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: avg,p(95),p(99)
    volumes:
      - ./loadtest:/loadtest:ro
      - ./results:/results
    depends_on:
      - api
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
